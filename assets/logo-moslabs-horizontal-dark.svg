<svg viewBox="0 0 580 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Blue gradient for dark background -->
    <linearGradient id="blueGradientDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#99aaff;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#6677ff;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#3344ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a22aa;stop-opacity:1" />
    </linearGradient>

    <!-- Orange gradient for dark background -->
    <linearGradient id="orangeGradientDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffcc77;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#ffaa44;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#ee7722;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bb4400;stop-opacity:1" />
    </linearGradient>

    <!-- Gloss overlay gradient -->
    <linearGradient id="glossGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.28);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0);stop-opacity:1" />
    </linearGradient>

    <!-- Text gradients -->
    <linearGradient id="mosTextGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#eef0ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#aab4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7766dd;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="labsTextGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.5);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.25);stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Blue rounded square -->
  <rect x="0" y="2" width="58" height="58" rx="15" fill="url(#blueGradientDark)" stroke="white" stroke-width="0.18" stroke-opacity="1"/>

  <!-- Gloss overlay for blue square -->
  <rect x="0" y="2" width="58" height="29" rx="15" fill="url(#glossGradient)"/>

  <!-- Orange rounded square -->
  <rect x="30" y="36" width="58" height="58" rx="15" fill="url(#orangeGradientDark)" stroke="white" stroke-width="0.12" stroke-opacity="1"/>

  <!-- Gloss overlay for orange square -->
  <rect x="30" y="36" width="58" height="29" rx="15" fill="url(#glossGradient)"/>

  <!-- MOS text -->
  <text x="128" y="74" font-family="Plus Jakarta Sans, sans-serif" font-size="58" font-weight="800" letter-spacing="-2.5" fill="url(#mosTextGradient)">MOS</text>

  <!-- Separator line -->
  <line x1="322" y1="34" x2="322" y2="90" stroke="white" stroke-width="1" stroke-opacity="0.05"/>

  <!-- Labs text -->
  <text x="336" y="74" font-family="Plus Jakarta Sans, sans-serif" font-size="58" font-weight="300" letter-spacing="5" fill="url(#labsTextGradient)">Labs</text>
</svg>