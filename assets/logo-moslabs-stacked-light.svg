<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Blue gradient for light background (darker) -->
    <linearGradient id="blueGradientStackedLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7788ee;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#5566dd;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#2233cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a99;stop-opacity:1" />
    </linearGradient>

    <!-- Orange gradient for light background (darker) -->
    <linearGradient id="orangeGradientStackedLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffbb55;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#ff9933;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#dd6611;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#aa4400;stop-opacity:1" />
    </linearGradient>

    <!-- Gloss overlay gradient (more prominent) -->
    <linearGradient id="glossGradientStackedLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.35);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0);stop-opacity:1" />
    </linearGradient>

    <!-- MOS text gradient (dark) -->
    <linearGradient id="mosTextGradientStackedLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>

    <!-- Labs text gradient (dark with opacity) -->
    <linearGradient id="labsTextGradientStackedLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(0,0,0,0.4);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(0,0,0,0.4);stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon group -->
  <g transform="translate(52, 10)">
    <!-- Blue rounded square -->
    <rect x="0" y="2" width="50" height="50" rx="13" fill="url(#blueGradientStackedLight)" stroke="white" stroke-width="0.18" stroke-opacity="1"/>

    <!-- Gloss overlay for blue square -->
    <rect x="0" y="2" width="50" height="25" rx="13" fill="url(#glossGradientStackedLight)"/>

    <!-- Orange rounded square -->
    <rect x="28" y="34" width="50" height="50" rx="13" fill="url(#orangeGradientStackedLight)" stroke="white" stroke-width="0.12" stroke-opacity="1"/>

    <!-- Gloss overlay for orange square -->
    <rect x="28" y="34" width="50" height="25" rx="13" fill="url(#glossGradientStackedLight)"/>
  </g>

  <!-- MOS text -->
  <text x="100" y="140" font-family="Plus Jakarta Sans, sans-serif" font-size="44" font-weight="800" letter-spacing="-2" text-anchor="middle" fill="#1a1a2e">MOS</text>

  <!-- Labs text -->
  <text x="100" y="175" font-family="Plus Jakarta Sans, sans-serif" font-size="34" font-weight="300" letter-spacing="6" text-anchor="middle" fill="rgba(0,0,0,0.4)">Labs</text>
</svg>