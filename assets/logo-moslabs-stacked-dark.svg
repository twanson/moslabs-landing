<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Blue gradient for dark background -->
    <linearGradient id="blueGradientStackedDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#99aaff;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#6677ff;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#3344ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a22aa;stop-opacity:1" />
    </linearGradient>

    <!-- Orange gradient for dark background -->
    <linearGradient id="orangeGradientStackedDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffcc77;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#ffaa44;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#ee7722;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bb4400;stop-opacity:1" />
    </linearGradient>

    <!-- Gloss overlay gradient -->
    <linearGradient id="glossGradientStacked" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.28);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0);stop-opacity:1" />
    </linearGradient>

    <!-- Text gradients -->
    <linearGradient id="mosTextGradientStacked" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#eef0ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#aab4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7766dd;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="labsTextGradientStacked" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.5);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.25);stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon group -->
  <g transform="translate(52, 10)">
    <!-- Blue rounded square -->
    <rect x="0" y="2" width="50" height="50" rx="13" fill="url(#blueGradientStackedDark)" stroke="white" stroke-width="0.18" stroke-opacity="1"/>

    <!-- Gloss overlay for blue square -->
    <rect x="0" y="2" width="50" height="25" rx="13" fill="url(#glossGradientStacked)"/>

    <!-- Orange rounded square -->
    <rect x="28" y="34" width="50" height="50" rx="13" fill="url(#orangeGradientStackedDark)" stroke="white" stroke-width="0.12" stroke-opacity="1"/>

    <!-- Gloss overlay for orange square -->
    <rect x="28" y="34" width="50" height="25" rx="13" fill="url(#glossGradientStacked)"/>
  </g>

  <!-- MOS text -->
  <text x="100" y="140" font-family="Plus Jakarta Sans, sans-serif" font-size="44" font-weight="800" letter-spacing="-2" text-anchor="middle" fill="url(#mosTextGradientStacked)">MOS</text>

  <!-- Labs text -->
  <text x="100" y="175" font-family="Plus Jakarta Sans, sans-serif" font-size="34" font-weight="300" letter-spacing="6" text-anchor="middle" fill="url(#labsTextGradientStacked)">Labs</text>
</svg>